ta à forma normal."},{"n":"Tempestade","tipo":"Feitiço","lvl":10,"rec":2,"t":"Escolha um dos tipos de tempestade abaixo e faça um teste de conjuração contra todos os alvos distantes. Alvos atingidos sofrem os efeitos até o mestre gastar1 Ponto de Medo no turno dele para encerrar este feitiço. • Nevasca: causa 2d20+8 de dano mágico e deixa os alvos temporariamente Vulneráveis. • Furacão: causa 3d10+10 de dano mágico. Escolha uma direção para a qual o vento sopra. Alvos não podem se mover contra o vento. • Tempestade de Areia: cause 5d6+9 de dano mágico. Ataques oriundos de um ponto além do alcance corpo a corpo têm desvantagem."}],"Esplendor":[{"n":"Raio Luminoso","tipo":"Feitiço","lvl":1,"rec":1,"t":"Faça um teste de conjuração contra um alvo distante. Em um sucesso, gaste 1 Ponto de Esperança para lançar um raio de luz radiante contra ele, causando d8+2 de dano mágico usando sua Proficiência. O alvo fica temporariamente Vulnerável e emite uma luz intensa até se recuperar dessa condição."},{"n":"Toque Reparador","tipo":"Feitiço","lvl":1,"rec":1,"t":"Você toca uma criatura e canaliza magia curativa para fechar seus ferimentos. Quando pode passar alguns minutos se concentrando em quem está ajudando, gaste 2 Pontos de Esperança para recuperar 1 PV ou PF do alvo. Uma vez por descanso longo, ao passar esse momento curativo descobrindo algo novo sobre a criatura ou revelando algo sobre si mesmo a ela, você pode fazê-la recuperar 2 Pontos de Vida ou Pontos de Fadiga, em vez de 1."},{"n":"Validação","tipo":"Talento","lvl":1,"rec":0,"t":"Uma vez por descanso, após o teste de um aliado, mas antes das consequências ocorrerem, você pode auxiliá-lo com palavras de apoio. Ao fazer isso, seu aliado pode rolar os dados novamente."},{"n":"Últimas Palavras","tipo":"Feitiço","lvl":2,"rec":1,"t":"Você pode conceder um momento de vida a um cadáver para conversar com ele. Faça um teste de conjuração (13). Em um sucesso com Esperança, o cadáver responde até três perguntas. Em um sucesso com Medo, o cadáver responde uma pergunta. O cadáver responde com sinceridade, mas não pode fornecer informações que desconhecia enquanto estava vivo. Se falhar, ou após o cadáver terminar de responder às suas perguntas, ele se desfaz em pó."},{"n":"Mãos Curativas","tipo":"Feitiço","lvl":2,"rec":1,"t":"Faça um teste de conjuração (13) tendo como alvo uma criatura corpo a corpo que não seja você. Em um sucesso, marque 1 Ponto de Fadiga para recuperar 2 Pontos de Vida ou Pontos de Fadiga do alvo. Se falhar, marque 1 Ponto de Fadiga para recuperar 1 PV ou PF do alvo. Você não pode curar o mesmo alvo novamente até seu próximo descanso longo."},{"n":"Novo Fôlego","tipo":"Talento","lvl":3,"rec":2,"t":"Uma vez por descanso, ao acertar um ataque contra um adversário, você pode recuperar 1 Ponto de Vida ou 3 Pontos de Fadiga. Em um sucesso com Esperança, você também recupera 1 PV ou 3 PF de um aliado próximo."},{"n":"Voz da Razão","tipo":"Talento","lvl":3,"rec":1,"t":"Você fala com poder e autoridade sem igual. Você tem vantagem em testes para acalmar situações violentas ou convencer alguém a seguir sua ordem. Além disso, você demonstra mais firmeza sob pressão. Quando todos seus Pontos de Fadiga estiverem marcados, você ganha um bônus de +1 na Proficiência para rolagens de dano."},{"n":"Adivinhação","tipo":"Feitiço","lvl":4,"rec":1,"t":"Uma vez por descanso longo, gaste 3 Pontos de Esperança para se comunicar com as forças do além e fazer uma única pergunta sobre algum evento, lugar, pessoa ou situação no futuro próximo que possa ser respondida com “sim” ou “não”. O tempo presente desaparece por um momento e a resposta surge magicamente diante de você."},{"n":"Sigilo da Vida","tipo":"Feitiço","lvl":4,"rec":1,"t":"Gaste 3 Pontos de Esperança e escolha um aliado próximo. Ele é marcado por um brilhante sigilo de proteção. Quando esse aliado for fazer um movimento de morte, ele recupera 1 PV em vez disso. Este efeito termina quando salva o alvo de um movimento de morte, quando você conjura Sigilo da Vida sobre outro alvo ou quando faz um descanso longo."},{"n":"Moldar Material","tipo":"Feitiço","lvl":5,"rec":1,"t":"Gaste 1 Ponto de Esperança para moldar parte de um material natural que esteja tocando (como gelo, madeira ou pedra) à sua vontade. A área do material não pode ser maior que você. Por exemplo, você pode criar uma ferramenta rudimentar ou criar uma porta. Você só pode afetar o material próximo do ponto que você está tocando."},{"n":"Punição","tipo":"Feitiço","lvl":5,"rec":2,"t":"Uma vez por descanso, gaste 3 Pontos de Esperança para carregar sua Punição. Ao acertar seu próximo ataque de arma, dobre o resultado da rolagem de dano. Independente do tipo de dano da arma, esse ataque causa dano mágico."},{"n":"Restauração","tipo":"Feitiço","lvl":6,"rec":2,"t":"Após um descanso longo, coloque um número de marcadores igual ao seu atributo de conjuração nesta carta. Toque uma criatura e gaste qualquer quantidade de marcadores. Para cada marcador gasto, recupere 2 Pontos de Vida ou Pontos de Fadiga do alvo. Você também pode gastar um marcador desta carta para tocar uma criatura e recuperá-la da condição Vulnerável ou curar uma doença física ou mágica (o mestre pode exigir o gasto de mais marcadores, dependendo da potência da doença). Após um descanso longo, marcadores não utilizados são perdidos."},{"n":"Zona de Proteção","tipo":"Feitiço","lvl":6,"rec":2,"t":"Faça um teste de conjuração (16). Uma vez por descanso longo, em um sucesso, escolha um ponto em alcance distante e crie uma zona de proteção visível para todos os aliados muito próximos do ponto de origem. Ao fazer isso, coloque 1d6 nesta carta, com o 1 virado para cima. Quando um aliado na zona de proteção sofre dano, reduza esse dano pelo valor do dado. Em seguida, aumente o valor do dado em um. Se o valor do dado for ultrapassar 6, este efeito termina."},{"n":"Golpe Curativo","tipo":"Feitiço","lvl":7,"rec":1,"t":"Ao causar dano a um adversário, você pode gastar 2 Pontos de Esperança para recuperar 1 PV de um aliado próximo."},{"n":"Dom do Esplendor","tipo":"Talento","lvl":7,"rec":2,"t":"Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio do Esplendor, receba os seguintes benefícios: • Um bônus de +3 no seu limiar de dano grave; • Uma vez por descanso longo, quando o dano sofrido exigir que marque PV, você pode, em vez disso, marcar uma quantidade equivalente de PF ou gastar uma quantidade equivalente de Esperança."},{"n":"Aura Defensora","tipo":"Feitiço","lvl":8,"rec":2,"t":"Marque 1 Ponto de Fadiga para conjurar uma aura protetora sobre um alvo muito próximo. Quando o alvo marca 1 Ponto de Armadura, ele reduz a gravidade do ataque em um limiar adicional. Se este feitiço fizer uma criatura que sofreria dano não marcar Pontos de Vida, o efeito termina. Você pode manter a Aura Defensora apenas sobre uma criatura por vez."},{"n":"Fulgor Atordoante","tipo":"Feitiço","lvl":8,"rec":2,"t":"Faça um teste de conjuração para disparar raios solares contra todos os adversários distantes à sua frente. Em um sucesso, gaste qualquer quantidade de Pontos de Esperança e force um número equivalente de alvos atingidos a fazer um teste de reação (14). Alvos bem-sucedidos sofrem 3d20+3 de dano mágico. Alvos que falharem sofrem 4d20+5 de dano mágico e ficam temporariamente Atordoados. Enquanto estiverem Atordoados, os alvos não podem usar reações e não podem fazer quaisquer outras ações até que se recuperem dessa condição."},{"n":"Aura Esmagadora","tipo":"Feitiço","lvl":9,"rec":2,"t":"Faça um teste de conjuração (15) para fortalecer sua aura com magia. Em um sucesso, gaste 2 Pontos de Esperança para tornar sua Presença igual ao seu atributo de conjuração até seu próximo descanso longo. Enquanto este feitiço estiver ativo, seus adversários devem marcar 1 Ponto de Fadiga ao selecionarem você como alvo de um ataque."},{"n":"Feixe de Remissão","tipo":"Feitiço","lvl":9,"rec":2,"t":"Faça um teste de conjuração (16). Em um sucesso, marque uma quantidade qualquer de PF para escolher uma linha de aliados em alcance distante como alvo. Você pode recuperar um número de Pontos de Vida, divididos como você quiser entre os alvos, igual à quantidade de PF que marcou."},{"n":"Revigorar","tipo":"Feitiço","lvl":10,"rec":3,"t":"Após você ou um aliado próximo usar uma habilidade com limite de uso (como uma vez por descanso ou uma vez por sessão), você pode gastar uma quantidade qualquer de Pontos de Esperança e rolar um número equivalente de d6. Se tirar 6 em qualquer dado, a habilidade pode ser usada novamente."},{"n":"Ressurreição","tipo":"Feitiço","lvl":10,"rec":2,"t":"Faça um teste de conjuração (20). Em um sucesso, faça com que uma criatura morta há no máximo 100 anos volte à vida com todas as suas capacidades. Em seguida, role 1d6. Se tirar 5 ou menos, coloque esta carta na reserva permanentemente. Se falhar, você não pode conjurar Ressurreição novamente por uma semana."}],"Valor":[{"n":"Armadura Corporal","tipo":"Talento","lvl":1,"rec":0,"t":"Enquanto não equipar uma armadura, você tem Armadura base igual a 3 + sua Força e usa estes limiares de dano base: • 1º patamar: 9/19; • 2º patamar: 11/24; • 3º patamar: 13/31; • 4º patamar: 15/38."},{"n":"Imposição","tipo":"Talento","lvl":1,"rec":0,"t":"Ataque um alvo corpo a corpo com sua arma principal. Em um sucesso, você causa dano e o empurra para um ponto em alcance próximo. Em um sucesso com Esperança, acrescente 1d6 à rolagem de dano. Além disso, gaste 1 Ponto de Esperança para deixá-lo temporariamente Vulnerável."},{"n":"Sou Seu Escudo","tipo":"Talento","lvl":1,"rec":1,"t":"Quando um aliado muito próximo for sofrer dano, você pode marcar 1 Ponto de Fadiga para prostrar-se no caminho e virar o alvo do ataque no lugar dele. Ao sofrer dano desse ataque, você pode marcar um número qualquer de Pontos de Armadura."},{"n":"Força Esmagadora","tipo":"Talento","lvl":2,"rec":1,"t":"Você usa toda sua força física em um combate. Ao acertar um ataque usando uma arma com alcance corpo a corpo, receba um bônus igual à sua Força na rolagem de dano."},{"n":"Presença Corajosa","tipo":"Talento","lvl":2,"rec":0,"t":"Ao fazer um teste de Presença, você pode gastar 1 Ponto de Esperança para somar sua Força à rolagem. Além disso, uma vez por descanso, quando for sofrer uma condição, você pode descrever como sua Presença Corajosa ajuda na situação e impede que você sofra a condição."},{"n":"Inspiração Crítica","tipo":"Talento","lvl":3,"rec":1,"t":"Uma vez por descanso, quando você obtém um sucesso crítico em um ataque, todos os aliados muito próximos podem recuperar 1 PF ou receber 1 Ponto de Esperança."},{"n":"Palavras de Conforto","tipo":"Talento","lvl":3,"rec":1,"t":"Uma vez por descanso longo, quando você consola ou inspira um aliado que falhou em um teste, vocês dois podem recuperar 2 Pontos de Fadiga cada."},{"n":"Incitar","tipo":"Talento","lvl":4,"rec":1,"t":"Descreva como você provoca um alvo próximo. Em seguida, faça um teste de Presença contra ele. Em um sucesso, o alvo deve marcar 1 PF e, na próxima vez que o mestre colocá-lo em foco, ele deve atacar você com desvantagem."},{"n":"Bastião","tipo":"Talento","lvl":4,"rec":2,"t":"Quando um aliado próximo falhar em um teste, você pode gastar 2 Pontos de Esperança para permitir que ele role novamente o Dado de Medo ou de Esperança."},{"n":"Armeiro","tipo":"Talento","lvl":5,"rec":1,"t":"Você recebe um bônus de +1 na Armadura enquanto estiver usando armadura. Ao escolher Reparar Armadura como movimento de repouso durante um descanso, seus aliados também recuperam 1 Ponto de Armadura."},{"n":"Golpe Inspirador","tipo":"Talento","lvl":5,"rec":1,"t":"Uma vez por descanso, ao ter sucesso crítico em um ataque, você e todos os aliados que possam vê-lo ou ouvi-lo podem recuperar 1 Ponto de Vida ou 1d4 Pontos de Fadiga."},{"n":"Inevitável","tipo":"Talento","lvl":6,"rec":1,"t":"Ao falhar em um teste, seu próximo teste é feito com vantagem."},{"n":"Altivez","tipo":"Talento","lvl":6,"rec":2,"t":"Receba um bônus igual à sua Proficiência no seu limiar grave. Ao marcar 1 ou mais PV devido a um ataque, recupere 1 Ponto de Fadiga."},{"n":"Desprezar Fraqueza","tipo":"Talento","lvl":7,"rec":1,"t":"Quando sofrer dano, você pode marcar 1 Ponto de Fadiga para reduzir a gravidade do dano em um limiar. Ao fazer isso, role 1d6. Se tirar 3 ou menos, coloque esta carta na reserva."},{"n":"Dom do valor","tipo":"Talento","lvl":7,"rec":1,"t":"Se 4 ou mais cartas de domínio na sua mão pertencerem ao domínio do Valor, receba os seguintes benefícios: • Bônus de +1 na Armadura; • Ao marcar 1 ou mais Pontos de Vida sem marcar Pontos de Armadura, recupere 1 PA."},{"n":"Testar os Limites","tipo":"Talento","lvl":8,"rec":1,"t":"Uma vez por descanso longo, marque 3 Pontos de Fadiga para testar os limites de seu corpo. Você recebe um bônus de +2 em todos os atributos até seu próximo descanso."},{"n":"Abalo Sísmico","tipo":"Talento","lvl":8,"rec":2,"t":"Gaste 2 Pontos de Esperança para golpear o solo abaixo de você. Faça um teste de Força contra todos os alvos próximos. Alvos atingidos são empurrados para um ponto em alcance distante e devem fazer um teste de reação (17). Quem falhar, sofre 4d10+8 de dano. Quem passar sofre metade do dano."},{"n":"Manter Posição","tipo":"Talento","lvl":9,"rec":1,"t":"Descreva a posição defensiva que você assume e gaste 1 Ponto de Esperança. Se um adversário se mover para alcance muito próximo, ele é puxado para o alcance corpo a corpo e fica Imobilizado. Esta condição dura até você se mover ou rolar uma falha com Medo, ou até o mestre gastar 2 Pontos de Medo no turno dele para encerrá-la."},{"n":"Líder Exemplar","tipo":"Talento","lvl":9,"rec":3,"t":"Ao causar dano a um adversário, você pode marcar 1 PF e descrever como encoraja seus aliados. O próximo personagem que atacar esse adversário pode recuperar 1 Ponto de Fadiga ou receber 1 Ponto de Esperança."},{"n":"Invencível","tipo":"Talento","lvl":10,"rec":4,"t":"Ao marcar seu último Ponto de Vida, em vez de fazer um movimento de morte, você pode recuperar 1d6 Pontos de Vida. Em seguida, esta carta vai para sua reserva."},{"n":"Defesa Irredutível","tipo":"Talento","lvl":10,"rec":1,"t":"Quando for marcar 1 Ponto de Armadura, role uma quantidade de d6 igual à sua Proficiência. Se algum tirar 6, reduza a gravidade em um limiar sem marcar 1 Ponto de Armadura."}],"Sangue":[{"n":"Espinho de Sangue","tipo":"Feitiço","lvl":1,"rec":1,"t":"Faça um teste de Conjuração contra um alvo em alcance Próximo. Em um sucesso, gaste uma Esperança para causar 1d8+2 de dano mágico ao alvo usando sua Proficiência, e o alvo marca Estresse. Se você tiver ao menos 3 Pontos de Vida marcados, o dado de dano é um d10."},{"n":"Talismã Vital","tipo":"Feitiço","lvl":1,"rec":0,"t":"Marque um Ponto de Vida para conjurar um talismã infundido com sua essência vital. Quando o portador do talismã sofreria dano Grave ou maior, ele pode destruir o talismã e reduzir o dano em dois limiares. O talismã desaparece quando você descansa ou conjura este feitiço de novo."},{"n":"Poder Através da Dor","tipo":"Talento","lvl":1,"rec":1,"t":"Quando você marca um Ponto de Vida, coloque um marcador nesta carta. Em um ataque bem-sucedido, você pode gastar qualquer quantidade de marcadores desta carta para ganhar +1d6 de dano no ataque por marcador gasto. Esta carta pode ter no máximo uma quantidade de marcadores igual ao seu valor de Conjuração. Limpe os marcadores desta carta quando você fizer um descanso longo."},{"n":"Marca da Castigação","tipo":"Feitiço","lvl":2,"rec":1,"t":"Quando você tem sucesso em um teste de ataque contra um alvo, pode marcar Estresse para Marcá-lo até você fazer um descanso longo ou conjurar este feitiço de novo. Você sempre sabe a direção do alvo Marcado. Se o alvo Marcado causa dano a você, você pode remover a condição Marcado para fazê-lo marcar 2 Pontos de Vida."},{"n":"Palpitações","tipo":"Feitiço","lvl":2,"rec":2,"t":"Quando você ou um aliado faz um teste para assustar ou intimidar uma criatura em alcance Próximo, você pode gastar uma Esperança para dar vantagem à rolagem. Em um sucesso, o alvo marca Estresse. Além disso, uma vez por descanso, você pode gastar uma Esperança para acalmar a si mesmo ou uma criatura disposta em alcance Próximo, permitindo ao alvo limpar 2 Estresse."},{"n":"Fantoche de Sangue","tipo":"Feitiço","lvl":3,"rec":2,"t":"Faça um teste de Conjuração contra um adversário em alcance Próximo. Em um sucesso, gaste uma Esperança para fazer o seguinte na ordem que escolher: mover o alvo até o alcance Próximo de sua posição atual (para movê-lo para terreno perigoso, gaste outra Esperança); o alvo faz um ataque padrão contra outro alvo de sua escolha dentro do alcance do ataque."},{"n":"Chifrada Ardente","tipo":"Feitiço","lvl":3,"rec":3,"t":"Tenha sucesso em um teste de Conjuração (13). Em um sucesso, marque um Ponto de Vida para inflamar a essência vital de um grupo em alcance Distante, fazendo cada alvo marcar um Ponto de Vida. Se você tiver ao menos 3 Pontos de Vida marcados, cada alvo marca 2 Pontos de Vida em vez disso."},{"n":"Arpão Macabro","tipo":"Feitiço","lvl":4,"rec":1,"t":"Faça um teste de Conjuração contra uma criatura em alcance Distante. Em um sucesso, marque Estresse para arremessar um arpão de sangue mágico no alvo, causando 1d10 de dano mágico usando sua Proficiência. Então você pode puxar-se até o alcance Corpo a Corpo do alvo ou puxar o alvo até o alcance Corpo a Corpo de você. Alternativamente, se você mirar em um objeto ou terreno em alcance Distante, faça um teste de Conjuração (13). Em um sucesso, você puxa o objeto até você ou você até o terreno."},{"n":"Tecer a Carne","tipo":"Feitiço","lvl":4,"rec":1,"t":"Uma vez por descanso longo, você pode marcar um Ponto de Vida para coagular, suturar e fortalecer outros com sua própria essência vital. Cada alvo disposto em alcance Muito Próximo limpa um Ponto de Vida e um Compartimento de Armadura."},{"n":"Forma Viscosa","tipo":"Feitiço","lvl":5,"rec":1,"t":"Marque Estresse para colocar uma quantidade de marcadores igual ao seu valor de Conjuração nesta carta e transformar-se em uma poça de sangue. Remova um marcador cada vez que você faz um teste ou sofre dano. Você sai desta forma quando remove o último marcador desta carta. Enquanto está na forma de sangue, você ganha resistência a dano físico e pode deslizar por qualquer espaço que um líquido possa atravessar."},{"n":"Parasita da Vontade","tipo":"Feitiço","lvl":5,"rec":2,"t":"Faça um teste de Conjuração contra um adversário em alcance Próximo. Uma vez por descanso em um sucesso, marque um Ponto de Vida para Infectar o alvo com um verme sanguíneo mágico minúsculo. Testes de Presença contra o alvo Infectado têm vantagem. Quando o alvo Infectado faz um teste de ataque, você pode gastar uma Esperança para dar desvantagem à rolagem. A condição Infectado dura até você descansar ou sacrificar o verme para fazer o alvo Infectado marcar um Ponto de Vida."},{"n":"Vínculo de Sangue","tipo":"Feitiço","lvl":6,"rec":1,"t":"Faça um teste de Conjuração contra um adversário em alcance Próximo. Em um sucesso, marque Estresse para retardar a vitalidade do alvo. O alvo fica temporariamente Restringido e Vulnerável. Cada vez que o alvo é posto em foco enquanto qualquer uma dessas condições persiste, ele marca Estresse."},{"n":"Elo Vital","tipo":"Feitiço","lvl":6,"rec":0,"t":"Faça um teste de Conjuração (14). Uma vez por descanso em um sucesso, você conjura um vínculo mágico entre você e um alvo disposto em alcance Próximo que dura até o fim da cena. Quando qualquer uma das criaturas vinculadas marcaria um Ponto de Vida, a outra criatura vinculada pode marcar um Ponto de Vida em seu lugar."},{"n":"Tocado pelo Sangue","tipo":"Talento","lvl":7,"rec":2,"t":"Quando 4 ou mais das cartas de domínio no seu loadout são do domínio Sangue, ganhe os seguintes benefícios: você ganha uma Esperança quando sofre dano Maior ou maior; quando você faz um teste de Conjuração, pode gastar uma Esperança para ganhar um bônus igual ao número de Pontos de Vida que marcou."},{"n":"Golpe Vampírico","tipo":"Talento","lvl":7,"rec":2,"t":"Quando você causa dano Maior ou maior a um adversário em alcance Próximo, você pode marcar Estresse para limpar um Ponto de Vida."},{"n":"Proteção Vital","tipo":"Feitiço","lvl":8,"rec":1,"t":"Escolha o tipo de dano físico ou mágico e faça um teste de Conjuração (15). Em um sucesso, você traça um círculo de sangue Muito Próximo no chão ao seu redor que concede às criaturas de sua escolha dentro dele resistência a esse tipo de dano. O círculo dura até você sofrer dano Maior ou maior, sair do círculo ou conjurar este feitiço de novo."},{"n":"Árvore Sangrenta","tipo":"Feitiço","lvl":8,"rec":2,"t":"Uma vez por descanso longo, quando um adversário em alcance Próximo é derrotado, você pode fazer o corpo dele irromper com uma árvore venosa e retorcida que jorra essência vital. Coloque uma quantidade de marcadores nesta carta igual ao seu valor de Conjuração. Um PJ em alcance Corpo a Corpo da árvore pode gastar um marcador desta carta para sifonar a essência vital da árvore e limpar um Ponto de Vida."},{"n":"Onda de Icor","tipo":"Feitiço","lvl":9,"rec":3,"t":"Marque um Ponto de Vida para fazer um teste de Conjuração contra todos os alvos em alcance Próximo à sua frente. Em um sucesso, cause dano mágico d10 usando o número de Pontos de Vida que você marcou em vez de sua Proficiência. Em uma falha, cause metade do dano."},{"n":"Glifo da Hemorragia","tipo":"Feitiço","lvl":9,"rec":3,"t":"Faça um teste de Conjuração contra um alvo em alcance Próximo. Em um sucesso, gaste uma Esperança para marcar o alvo com um glifo mágico que o faz sangrar profusamente. Até o glifo desaparecer, o dano que o alvo sofre é aumentado em um limiar. O glifo desaparece quando você descansa, conjura este feitiço de novo, ou o alvo sofre dano Grave ou maior."},{"n":"Adamância Escabrosa","tipo":"Talento","lvl":10,"rec":1,"t":"Suas feridas se selam em crostas blindadas. Quando você marca 2 ou mais Pontos de Vida de um ataque, limpe um Compartimento de Armadura."},{"n":"Festim Sanguíneo","tipo":"Feitiço","lvl":10,"rec":2,"t":"Faça um teste de Conjuração contra um adversário em alcance Próximo. Uma vez por descanso em um sucesso, role uma quantidade de d6 igual ao número de Pontos de Vida que você marcou, e você pode marcar um Ponto de Vida adicional para rolar novamente qualquer quantidade desses dados. O alvo marca um Ponto de Vida para cada resultado 4 ou maior."}],"Pavor":[{"n":"Golpe Sombrio","tipo":"Feitiço","lvl":1,"rec":1,"t":"Faça um teste de Conjuração contra um alvo em alcance Distante. Em um sucesso, o alvo sofre 1d6+1 de dano mágico usando sua Proficiência e, da próxima vez que causar dano a um aliado, esse dano é reduzido à metade. Se você tiver sucesso com Medo, em vez disso o alvo sofre 1d10+1 de dano mágico usando sua Proficiência."},{"n":"Voz do Pavor","tipo":"Feitiço","lvl":1,"rec":0,"t":"Você pode falar magicamente direto na mente de uma criatura que possa ver. Para atormentá-la com suas palavras, faça um teste de Conjuração contra ela. Em um sucesso, ela deve marcar Estresse e fica temporariamente Vulnerável."},{"n":"Véu Umbral","tipo":"Feitiço","lvl":1,"rec":1,"t":"Uma vez por descanso, quando você rolar com Medo, pode gastar qualquer quantidade de Esperança para colocar uma quantidade igual de marcadores nesta carta, envolvendo-se em energia sombria. Depois que um ataque for feito contra você, você pode gastar qualquer quantidade de marcadores para dar ao ataque uma penalidade de -1 por marcador. No seu próximo descanso, remova todos os marcadores desta carta."},{"n":"Retribuição Hedionda","tipo":"Feitiço","lvl":2,"rec":2,"t":"Quando um aliado em alcance Próximo sofre dano de um alvo que você possa ver, você pode fazer um teste de Reação de Conjuração contra o alvo. Em um sucesso, marque Estresse para causar 1d6 de dano mágico a ele usando sua Proficiência."},{"n":"Sifão de Essência","tipo":"Feitiço","lvl":2,"rec":1,"t":"Faça um teste de Conjuração contra um alvo em alcance Muito Próximo. Em um sucesso, uma vez por descanso longo, o alvo sofre 1d20 de dano mágico usando sua Proficiência. Você recupera uma quantidade de Pontos de Vida igual ao número de Pontos de Vida que o alvo marcou por este ataque. Se tiver sucesso com Medo, você ganha +1 de Proficiência neste ataque."},{"n":"Aterrorizar","tipo":"Feitiço","lvl":3,"rec":1,"t":"Faça um teste de Conjuração contra um alvo em alcance Distante. Em um sucesso, o alvo marca 1d4 Estresse e você pode fazê-lo recuar um alcance para longe de você (Próximo para Distante, Distante para Muito Distante, etc.). Em um sucesso com Medo, o alvo fica temporariamente Vulnerável."},{"n":"Trauma Compartilhado","tipo":"Feitiço","lvl":3,"rec":1,"t":"Você pode transferir o sofrimento de uma criatura para outra. Uma vez por descanso, marque qualquer quantidade de Pontos de Vida em uma criatura disposta em alcance Corpo a Corpo para remover uma quantidade igual de Pontos de Vida de outra criatura disposta em alcance Corpo a Corpo. Você pode escolher a si mesmo no lugar de qualquer uma das criaturas."},{"n":"Correntes da Aflição","tipo":"Feitiço","lvl":4,"rec":2,"t":"Marque 2 Estresse para temporariamente Acorrentar um alvo em alcance Próximo. Quando uma criatura Acorrentada causa dano, o alvo do dano dela marca um Ponto de Vida a menos. Você não pode ter mais de uma criatura Acorrentada por vez."},{"n":"Invocar Horror","tipo":"Feitiço","lvl":4,"rec":2,"t":"Faça um teste de Conjuração contra um alvo em alcance Distante. Em um sucesso, gaste uma Esperança para invocar uma criatura sobrenatural que ataca o alvo, causando 1d10 de dano mágico usando sua Proficiência. O alvo deve ter sucesso em um teste de Reação (12) para se defender do horror ou marca 1d4 Estresse. Após fazer o ataque, a criatura se dissipa."},{"n":"Névoa Espectral","tipo":"Feitiço","lvl":5,"rec":0,"t":"Marque Estresse para invocar uma névoa sinistra que torna você e quaisquer alvos em alcance Próximo momentaneamente incorpóreos. Enquanto uma criatura está incorpórea, ela pode se mover através de objetos sólidos e é imune a dano físico. Uma criatura volta a ser corpórea após passar por um objeto sólido ou fazer um teste. Do contrário, este efeito termina no fim da cena."},{"n":"Golpe Nefasto","tipo":"Feitiço","lvl":5,"rec":1,"t":"Depois de fazer um ataque bem-sucedido, você pode gastar 2 Esperança para drenar poder do alvo. Para cada Ponto de Vida que seu alvo marcou por este ataque, o mestre perde um Medo."},{"n":"Fogo Sombrio","tipo":"Feitiço","lvl":6,"rec":2,"t":"Faça um teste de Conjuração contra todos os adversários em alcance Próximo. Você pode gastar uma Esperança para cada um que você tiver sucesso, e eles devem fazer um teste de Reação (14). Em uma falha, sofrem 1d8+6 de dano mágico usando sua Proficiência ao serem engolfados em chamas sombrias. Em um sucesso, sofrem metade do dano."},{"n":"Susto","tipo":"Feitiço","lvl":6,"rec":0,"t":"Quando você causa dano mágico a um alvo, você pode marcar Estresse para se teletransportar imediatamente para o alcance Corpo a Corpo dele. Quando você faz isso, ele fica Vulnerável até marcar um ou mais Pontos de Vida."},{"n":"Tocado pelo Pavor","tipo":"Talento","lvl":7,"rec":2,"t":"Quando 4 ou mais das cartas de domínio no seu loadout são do domínio Pavor, ganhe os seguintes benefícios: quando você tem sucesso com Medo, pode marcar 2 Estresse para impedir o mestre de ganhar um Medo. Uma vez por descanso, ao fazer um teste, você pode adicionar +1 à rolagem para cada marcador de Medo que o mestre tiver acumulado."},{"n":"Muralha da Fome","tipo":"Feitiço","lvl":7,"rec":2,"t":"Tenha sucesso em um teste de Conjuração (13) para criar uma muralha visível de energia necrótica contorcida em linha entre dois pontos em alcance Distante que dura até você marcar um Ponto de Vida ou conjurar este feitiço de novo. Qualquer criatura dentro da muralha quando ela surge, ou que tente passar por ela, deve marcar 2 Estresse e fazer um teste de Reação (16). Em uma falha, fica temporariamente Restringida pela muralha."},{"n":"Exército Sombrio","tipo":"Feitiço","lvl":8,"rec":2,"t":"Uma vez por descanso longo, em um sucesso, você pode invocar um grupo de demônios que cercam você e se movem com você. Coloque 8 marcadores nesta carta. Quando você causa dano a um alvo em alcance Muito Próximo, pode gastar um marcador para aumentá-lo em +1d8. Além disso, quando você sofre dano, pode gastar um marcador para reduzi-lo em 1d8. Cada vez que você gasta um marcador, um demônio age em seu favor e então desaparece. Remova todos os marcadores desta carta no seu próximo descanso."},{"n":"Carne Nefanda","tipo":"Feitiço","lvl":8,"rec":1,"t":"Você encarna a escuridão com que flertou. Enquanto esta carta está no seu loadout: ganhe +1 nos seus limiares de dano para cada Estresse que você marcou; quando rolar com Medo, você pode gastar 2 Esperança para limpar um Compartimento de Armadura."},{"n":"Danação","tipo":"Feitiço","lvl":9,"rec":2,"t":"Faça um teste de Conjuração contra um alvo em alcance Distante. Em um sucesso, marque qualquer quantidade de Estresse para rolar uma quantidade igual de d20, causando dano mágico igual ao resultado total. Se o alvo for derrotado como resultado deste ataque, todos os adversários em alcance Distante do alvo marcam Estresse."},{"n":"Saborear a Angústia","tipo":"Feitiço","lvl":9,"rec":0,"t":"Quando um adversário em alcance Próximo marca Estresse ou sofre dano Grave, você pode gastar uma Esperança para limpar um Estresse ou forçar o mestre a perder um Medo."},{"n":"Invocar Tormento","tipo":"Feitiço","lvl":10,"rec":2,"t":"Alvos com todo o seu Estresse marcado sofrem o dobro de dano dos seus ataques. Além disso, quando você derrota uma criatura com todo o Estresse dela marcado, você limpa um Estresse."},{"n":"Avatar do Terror","tipo":"Feitiço","lvl":10,"rec":1,"t":"Marque Estresse para se transformar em uma criatura alimentada pelo medo. Nesta forma, suas rolagens de dano ganham +1d6 para cada Medo que o mestre tiver. Além disso, ganhe uma Esperança quando o mestre usar uma habilidade de Medo em um adversário em alcance Próximo. Você deve gastar uma Esperança para fazer um teste enquanto estiver nesta forma. Do contrário, você sai dela."}]};

function dbStatus(s){ DB.status=s; const e=document.getElementById("dbst"); if(e){ e.textContent=({local:"◌ salvo só neste navegador",conectando:"… conectando ao banco",online:"☁ sincronizado com o banco",offline:"⚠ banco fora do ar — salvando local"})[s]||s; e.className="dbst "+s; } }
function dbInit(){
  if(!DB_CONFIG.databaseURL || !window.firebase){ dbStatus("local"); return; }
  try{
    firebase.initializeApp(DB_CONFIG);
    DB.ref=firebase.database().ref("mesas/"+MESA);
    DB.on=true; dbStatus("conectando");
    // primeira carga: banco manda; se o banco estiver vazio, sobe o que há no navegador
    DB.ref.child("fichas").once("value").then(snap=>{
      const remoto=snap.val();
      if(remoto && Object.keys(remoto).length){
        PJ=Object.values(remoto).map(normaliza);
        DB.ref.child("ordem").once("value").then(o=>{ const ord=o.val()||[]; PJ.sort((a,b)=>{ const ia=ord.indexOf(a.id), ib=ord.indexOf(b.id); return (ia<0?999:ia)-(ib<0?999:ib); }); PJ.forEach(p=>DB.ultimo[p.id]=JSON.stringify(limpo(p))); PJ.forEach(saveOneLocal); saveIndexLocal(); if(cur>=PJ.length)cur=0; render(); });
      } else {
        PJ.forEach(p=>DB.ref.child("fichas/"+p.id).set(limpo(p)));
        DB.ref.child("ordem").set(PJ.map(p=>p.id));
      }
      dbStatus("online");
      // escuta mudanças de outros jogadores
      DB.ref.child("fichas").on("value",s=>{
        const r=s.val()||{}; let mudou=false;
        Object.keys(r).forEach(id=>{ const j=JSON.stringify(normaliza(r[id])); if(DB.ultimo[id]!==j){ DB.ultimo[id]=j; const i=PJ.findIndex(p=>p.id===id); const nova=normaliza(JSON.parse(j)); if(i>=0){ Object.keys(PJ[i]).forEach(k=>{ if(k[0]==="_") nova[k]=PJ[i][k]; }); PJ[i]=nova; } else PJ.push(nova); saveOneLocal(nova); mudou=true; } });
        PJ.forEach((p,i)=>{ if(!r[p.id] && DB.ultimo[p.id]!==undefined){ PJ.splice(i,1); lsDel(KEY_FICHA(p.id)); delete DB.ultimo[p.id]; mudou=true; } });
        if(mudou){ if(cur>=PJ.length)cur=Math.max(0,PJ.length-1); saveIndexLocal(); const a=document.activeElement; if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.isContentEditable)){ DB.pendente=true; } else render(); }
      });
      DB.ref.child("ordem").on("value",o=>{ const ord=o.val(); if(!Array.isArray(ord))return; PJ.sort((a,b)=>{ const ia=ord.indexOf(a.id), ib=ord.indexOf(b.id); return (ia<0?999:ia)-(ib<0?999:ib); }); });
      firebase.database().ref(".info/connected").on("value",s=>dbStatus(s.val()?"online":"offline"));
    }).catch(e=>{ console.error(e); dbStatus("offline"); });
  }catch(e){ console.error(e); dbStatus("local"); }
}

const KEY_IDX=KEY+"_idx";           // ordem das abas: ["dahlia","baine",...]
const KEY_FICHA=id=>KEY+"_ficha_"+id;
let MEM={};
function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return MEM[k]??null;} }
function lsSet(k,v){ MEM[k]=v; try{localStorage.setItem(k,v);}catch(e){} }
function lsDel(k){ delete MEM[k]; try{localStorage.removeItem(k);}catch(e){} }
function limpo(o){ return JSON.parse(JSON.stringify(o,(k,v)=>(k[0]==="_")?undefined:v)); }
function saveOneLocal(p){ lsSet(KEY_FICHA(p.id),JSON.stringify(limpo(p))); }
function saveIndexLocal(){ lsSet(KEY_IDX,JSON.stringify(PJ.map(p=>p.id))); }
function saveOne(p){ saveOneLocal(p); dbSave(p); }
function saveIndex(){ saveIndexLocal(); dbIndex(); }
function saveAll(){ PJ.forEach(saveOne); saveIndex(); }
function normaliza(p){ if(p.pv==null)p.pv=0; if(p.fad==null)p.fad=0; if(p.esp==null)p.esp=2; if(p.arm==null)p.arm=0; if(p.corr==null)p.corr=0; if(!p.bolsa)p.bolsa=[]; if(!p.recursos)p.recursos=[]; if(p.notas==null)p.notas=""; if(!p.transFeats)p.transFeats=[]; if(!p.cartas)p.cartas=[]; if(!p.armaRes)p.armaRes="Nenhuma"; if(!p.experiencias)p.experiencias=[]; p.cartas.forEach(c=>{ if(c.mao==null)c.mao=true; }); if(typeof p.dominios==="string") p.dominios=p.dominios.split("&").map(s=>s.trim()); if(!p.corrupcaoRegra) p.corrupcaoRegra=BASE[0].corrupcaoRegra; return p; }
let PJ=[];
(function carregar(){
  let idx=null; try{ idx=JSON.parse(lsGet(KEY_IDX)||"null"); }catch(e){}
  if(!idx){
    // migração da versão antiga (tudo numa chave só)
    let velho=null; try{ velho=JSON.parse(lsGet(KEY)||"null"); }catch(e){}
    if(Array.isArray(velho)){ velho.forEach(p=>{ if(!p.id)p.id="pj_"+Math.random().toString(36).slice(2,8); }); PJ=velho; lsDel(KEY); }
    else PJ=JSON.parse(JSON.stringify(BASE));
    PJ.forEach(normaliza); saveAll(); return;
  }
  idx.forEach(id=>{ try{ const r=lsGet(KEY_FICHA(id)); if(r) PJ.push(normaliza(JSON.parse(r))); }catch(e){} });
  // fichas oficiais novas que ainda não existem neste navegador
  BASE.forEach(b=>{ if(!PJ.some(p=>p.id===b.id) && !idx.includes(b.id)){ PJ.push(normaliza(JSON.parse(JSON.stringify(b)))); saveOne(PJ[PJ.length-1]); } });
  saveIndex();
})();

/* ============ REPOUSO ============ */
let REST={tipo:null,mv:[],log:""};
function aplicarRepouso(p){
  if(REST.mv.length<2){toast("Escolha 2 movimentos");return;}
  const pat=patamar(p.nivel); let log=[];
  REST.mv.forEach(id=>{
    if(id==="prep"){ p.esp=Math.min(p.esperancaMax,p.esp+2); log.push("Preparar-se: +2 Esperança"); }
    else if(id==="arm"){ const r=rnd(4)+pat; p.arm=Math.max(0,p.arm-r); log.push("Reparar Armadura 1d4+"+pat+" = "+r+" PA"); }
    else if(id==="fad"){ const r=rnd(4)+pat; p.fad=Math.max(0,p.fad-r); log.push("Reduzir Fadiga 1d4+"+pat+" = "+r+" PF"); }
    else if(id==="pv"){ const r=rnd(4)+pat; p.pv=Math.max(0,p.pv-r); log.push("Tratar Feridas 1d4+"+pat+" = "+r+" PV"); }
    else if(id==="armT"){ p.arm=0; log.push("Armadura totalmente reparada"); }
    else if(id==="pvT"){ p.pv=0; log.push("Todas as feridas tratadas"); }
    else if(id==="fadT"){ p.fad=0; log.push("Fadiga zerada"); }
    else if(id==="proj"){ log.push("Trabalhou em um projeto (anote o progresso)"); }
  });
  if(REST.tipo==="longo" && p.id==="lucius"){ const v=p.recursos.find(r=>/vampiro/i.test(r.nome)); if(v&&v.val>0){v.val--; log.push("Vampiro: −1 marcador");} }
  REST.log=(REST.tipo==="curto"?"DESCANSO CURTO — ":"DESCANSO LONGO — ")+log.join(" · ");
  REST.mv=[]; saveOne(p); render(); toast("Repouso aplicado");
}

/* ============ DADOS DE DUALIDADE ============ */
let DICE={atr:"Agilidade",exp:-1,mod:0,adv:0,last:null};
function rolar(p){
  const h=rnd(12), f=rnd(12);
  let mod=(p.atributos[DICE.atr]||0)+(DICE.mod||0);
  let det=["Esperança <b>"+h+"</b>","Medo <i>"+f+"</i>",DICE.atr+" "+sg(p.atributos[DICE.atr]||0)];
  if(DICE.exp>=0&&p.experiencias[DICE.exp]){ mod+=p.experiencias[DICE.exp].bonus; det.push("Exp. +"+p.experiencias[DICE.exp].bonus); }
  if(DICE.adv){ const d=rnd(6); mod+=DICE.adv*d; det.push((DICE.adv>0?"vantagem +":"desvantagem −")+d); }
  if(DICE.mod) det.push("mod "+sg(DICE.mod));
  const tot=h+f+mod;
  const tipo=h===f?"crit":(h>f?"hope":"fear");
  DICE.last={tot,tipo,det:det.join(" · ")};
  if(tipo==="hope"||tipo==="crit"){ p.esp=Math.min(p.esperancaMax,p.esp+1); }
  if(tipo==="crit"){ p.fad=Math.max(0,p.fad-1); }
  saveOne(p); render();
}


/* ===== LEITOR DE FICHA EM PDF (formato "Surto Selvagem · ficha de mesa") ===== */
function pdfItemsToLines(pages){
  // pages: [{w, items:[{s,x,y}]}]  -> returns {lines:[string], header:[items]}
  const lefts=[], rights=[], header=[];
  pages.forEach((pg,pi)=>{
    let yA=null;
    let yC=null;
    if(pi===0){ const a=pg.items.find(i=>/^ATRIBUTOS$/.test(i.s.replace(/\s/g,""))); if(a) yA=a.y; const c=pg.items.find(i=>/^CONCEITO$/.test(i.s.replace(/\s/g,""))); if(c) yC=c.y; }
    pg.items.forEach(it=>{
      if(pi===0 && yA!=null && (it.y>yA+2 || (yC!=null && it.y>yC+2 && it.x<pg.w*0.5))) header.push(it);
      else if(it.x<pg.w*0.5) lefts.push({...it,pg:pi});
      else rights.push({...it,pg:pi});
    });
  });
  function toLines(items){
    items.sort((a,b)=>a.pg-b.pg || b.y-a.y || a.x-b.x);
    const lines=[]; let curL=null, curY=null, curPg=null;
    items.forEach(it=>{
      if(curL && it.pg===curPg && Math.abs(it.y-curY)<3.5){ curL.push(it); }
      else { if(curL) lines.push(curL); curL=[it]; curY=it.y; curPg=it.pg; }
    });
    if(curL) lines.push(curL);
    return lines.map(joinItems).filter(Boolean);
  }
  return {lines:[...toLines(lefts),...toLines(rights)],header};
}
function joinItems(l){
  l.sort((a,b)=>a.x-b.x); let out="",prev=null;
  l.forEach(i=>{ const t=unspace(i.s); if(!t.trim()){ if(out&&!/\s$/.test(out)) out+=" "; prev=i;return;} if(prev && out && !/\s$/.test(out) && (i.x-(prev.x+(prev.w||0))>1.2 || /^[\s]/.test(i.s))) out+=" "; out+=t; prev=i; });
  return out.replace(/[\x00-\x1f]/g,"").replace(/\s+/g," ").trim();
}
function unspace(s){ // "V A L O R · T A L E N T O" -> "VALOR · TALENTO"
  const t=s.trim();
  if(/^\S( \S)+$/.test(t)) return t.replace(/ /g,"");
  return s;
}
function tcase(s){ const small=/^(de|da|do|das|dos|a|o|e|em|na|no|à|ao|para|com|por)$/; return s.toLowerCase().split(" ").map((w,i)=>(i>0&&small.test(w))?w:w.replace(/(^|[\-–(])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase())).join(" "); }
function nearestBelow(header,label){
  const norm=t=>t.replace(/\s+/g,"").toUpperCase();
  const target=norm(label); let lab=null;
  const items=[...header].filter(i=>i.s.trim()).sort((a,b)=>b.y-a.y||a.x-b.x);
  for(let i=0;i<items.length&&!lab;i++){
    let acc="",x0=items[i].x,x1=items[i].x+(items[i].w||0);
    for(let j=i;j<items.length;j++){ if(Math.abs(items[j].y-items[i].y)>3) break; acc+=norm(items[j].s); x1=items[j].x+(items[j].w||0); if(acc===target){ lab={x:x0,w:x1-x0,y:items[i].y}; break; } if(acc.length>=target.length) break; }
  }
  if(!lab) return null;
  const cx=lab.x+(lab.w||0)/2;
  let best=null;
  header.forEach(i=>{ if(/^[+\-−–]?\d+$/.test(i.s.trim()) && i.y<lab.y-4 && lab.y-i.y<60){ const d=Math.abs((i.x+(i.w||0)/2)-cx); if(d<45 && (!best||d<best.d)) best={d,v:parseInt(i.s.replace(/[−–]/,"-"))}; } });
  return best?best.v:null;
}
function parseFichaPDF(pages, CARDS){

  // --- cabeçalho (itens com posição) ---

  Object.keys(S).forEach(k=>{ if(S[k]!=null) p[k]=S[k]; });

  // linhas do cabeçalho: título, nome, linha de classe

  const HL=hlines.map(joinItems).filter(Boolean);
  const all=[...HL,...L];
  for(const ln of all){ const m=ln.match(/^(.+?)\s*—\s*(.+?)\s*·\s*Nível\s*(\d+)\s*·\s*Domínios:\s*(.+?)\s*&\s*(.+)$/i); if(m){ p.classe=tcase(m[1]); p.subclasse=m[2].trim(); p.nivel=parseInt(m[3]); let d2=m[5].trim(); const ov=d2.match(/^(.*?)\s*Nível\s*(\d+)$/); if(ov){ d2=ov[1].trim(); p.nivel=parseInt(ov[2]); } p.dominios=[m[4].trim(),d2]; break; } }
  const ti=HL.findIndex(l=>/SURTOSELVAGEM/i.test(l.replace(/\s/g,"")));
  if(ti>=0 && HL[ti+1]){ const n=HL[ti+1].trim(); p.nome=(n===n.toUpperCase()&&/\p{L}/u.test(n)&&!/\d/.test(n))?tcase(n):n; }
  // --- corpo linear ---
  const K=l=>l.replace(/\s/g,"").toUpperCase();
  const HEADS={IDENTIDADE:"IDENTIDADE",ANCESTRALIDADE:"ANCESTRALIDADE",COMUNIDADE:"COMUNIDADE","SAÚDE&DANO":"SAÚDE & DANO","ARMAS&EQUIPAMENTO":"ARMAS & EQUIPAMENTO",HABILIDADESDECLASSE:"HABILIDADES DE CLASSE",ESPERANÇA:"ESPERANÇA",CARTASDEDOMÍNIO:"CARTAS DE DOMÍNIO",EXPERIÊNCIAS:"EXPERIÊNCIAS",CONCEITO:"CONCEITO"};
  const headOf=l=>{ const k=K(l); if(HEADS[k])return HEADS[k]; if(/^TRANSFORMAÇÃO/.test(k))return "TRANSFORMAÇÃO"; if(/^SUBCLASSE[—\-–]/.test(k))return "SUBCLASSE"; if(/^AVANÇOS/.test(k))return "AVANÇOS"; if(/^CORRUPÇÃODOSURTO/.test(k))return "CORRUPÇÃO"; return null; };
  const isHead=l=>!!headOf(l);
  const isFoot=l=>/Daggerheart \(Darrington Press\)/.test(l);
  const isJunk=l=>isFoot(l)||/^[\d\s·+–\-]+$/.test(l)||/^Nível \d+$/.test(l)||/^((DANO MENOR|DANO MAIOR|DANO GRAVE)\s*)+$|^(marque \d PV\s*)+$|^Limiares (=|por) .*|^\(metade .*/.test(l);
  const sec={}; let cur=null;
  const CARDH=/^(?:NV(\d+)·)?(.+?)·(TALENTO|FEITIÇO|GRIMÓRIO|GRIMOIRE|HABILIDADE)·RECORDAÇÃO(\d+)$/;
  L.forEach(l=>{ if(isJunk(l))return; if(CARDH.test(K(l))){ cur="CARTAS DE DOMÍNIO"; sec[cur]=sec[cur]||[]; } const h=headOf(l); if(h){ cur=h; sec[cur]=sec[cur]||[]; if(h==="SUBCLASSE") sec._sub=l.replace(/^SUBCLASSE\s*[—\-–]\s*/,"").trim(); if(h==="TRANSFORMAÇÃO") sec._transHead=l; return; } if(cur) sec[cur].push(l); });
  const feats=(arr)=>{ // "Nome:" seguido de texto
    const out=[]; let f=null;
    arr.forEach(l=>{ const m=l.match(/^([^:]{2,60}):\s*(.*)$/); if(m && /^\p{Lu}/u.test(m[1]) && !/\d/.test(m[1].slice(0,2))){ f={n:m[1].trim(),t:m[2].trim()}; out.push(f);} else if(f){ f.t=(f.t+" "+l).trim(); } });
    return out;
  };
  if(sec.CONCEITO) p.conceito=sec.CONCEITO.join(" ").replace(/^[“"]|[”"]$/g,"").trim();
  if(sec.ANCESTRALIDADE){ p.ancNome=sec.ANCESTRALIDADE[0]||""; p.ancFeats=feats(sec.ANCESTRALIDADE.slice(1)); }
  if(sec.COMUNIDADE){ p.comNome=sec.COMUNIDADE[0]||""; p.comFeats=feats(sec.COMUNIDADE.slice(1)); }
  if(sec["TRANSFORMAÇÃO"]){ p.transNome=(sec["TRANSFORMAÇÃO"][0]||"")+(sec._transHead&&/VOID/i.test(sec._transHead)?" (The Void)":""); p.transFeats=feats(sec["TRANSFORMAÇÃO"].slice(1)); }
  (sec["SAÚDE & DANO"]||[]).forEach(l=>{ const m=l.match(/Vida \((\S+)\) · Fadiga \((\d+)\) · Armadura \((\d+)\)/); if(m){ if(/^\d+$/.test(m[1]))p.pvMax=parseInt(m[1]); p.fadigaMax=parseInt(m[2]); p.armaduraMax=parseInt(m[3]); } });
  { const A=sec["ARMAS & EQUIPAMENTO"]||[]; let itens=[]; let mode=null;
    A.forEach(l=>{ let m;
      if((m=l.match(/^Principal:\s*(.+?)(?: —.*)?$/))){ p.armaPrim=m[1].trim(); mode=null; }
      else if((m=l.match(/^Secundária:\s*(.+?)(?: —.*)?$/))){ p.armaSec=m[1].trim(); mode=null; }
      else if((m=l.match(/^Armadura:\s*(.+?)(?: —.*)?$/))){ p.armadura=/^Sem armadura/i.test(m[1])?"Sem armadura (Armadura Corporal)":m[1].trim(); mode=null; }
      else if((m=l.match(/^Reserva:\s*(.+?)(?: —.*)?$/))){ p.armaRes=m[1].trim(); mode=null; }
      else if((m=l.match(/^Itens:\s*(.*)$/))){ itens.push(m[1]); mode="it"; }
      else if(mode==="it") itens[itens.length-1]+=" "+l;
      else if(/^"?\S/.test(l) && p.armaPrim && !p.armaSec) {} });
    p.itens=itens.join(" ").replace(/\s+/g," ").trim(); }
  { const H=sec["HABILIDADES DE CLASSE"]||[]; if(H.length){ const nm=H[0]; const rest=H.slice(1).join(" "); if(rest) p.habilidades.push({n:nm,t:rest}); else p.habilidades.push({n:"Habilidades de classe",t:nm}); } }
  { const E=sec["ESPERANÇA"]||[]; if(E.length) p.habilidades.push({n:E[0]+" (Esperança)",t:E.slice(1).join(" ")}); }
  { const Sb=sec.SUBCLASSE||[]; let grau=null,f=null;
    Sb.forEach(l=>{ let m; if((m=K(l).match(/^CONJURAÇÃO:(.+)$/))){ p.conjuracao=tcase(m[1]); return; }
      if(/^(FUNDAMENTAL|ESPECIALIZAÇÃO|MAESTRIA)$/.test(K(l))){ grau=tcase(K(l)); f=null; return; }
      if(grau && !f){ f={n:l+" ("+grau+")",t:""}; p.subFeats.push(f); return; }
      if(f) f.t=(f.t+" "+l).trim(); });
    if(sec._sub && !p.subclasse) p.subclasse=tcase(sec._sub); }
  { const C=sec["CARTAS DE DOMÍNIO"]||[]; let card=null,expect=false;
    C.forEach(l=>{ const m=K(l).match(/^(?:NV(\d+)·)?(.+?)·(TALENTO|FEITIÇO|GRIMÓRIO|GRIMOIRE|HABILIDADE)·RECORDAÇÃO(\d+)$/);
      if(m){ const dom=tcase(m[2]).replace("Meia-Noite","Meia-noite"); const tipo=tcase(m[3]).replace("Habilidade","Talento").replace("Grimoire","Grimório"); card={dom,tipo,rec:parseInt(m[4]),lvl:m[1]?parseInt(m[1]):null,n:"",t:"",mao:true}; p.cartas.push(card); expect=true; return; }
      if(card && expect){ card.n=tcase(l); expect=false; return; }
      if(card) card.t=(card.t+" "+l).trim(); });
    p.cartas.forEach(c=>{ const pool=(CARDS&&CARDS[c.dom])||[]; const ref=pool.find(x=>x.n.toLowerCase()===c.n.toLowerCase()); if(ref){ c.n=ref.n; if(c.lvl==null)c.lvl=ref.lvl; if(!c.t)c.t=ref.t; } if(c.lvl==null)c.lvl=1; }); }
  { (sec["EXPERIÊNCIAS"]||[]).forEach(l=>{ const m=l.match(/^(.+?)\s*\+\s*(\d+)$/); if(m) p.experiencias.push({nome:m[1].trim().replace(/\.$/,""),bonus:parseInt(m[2])}); }); }
  if(sec["AVANÇOS"]) p.notas="Avanços: "+sec["AVANÇOS"].join(" ");
  if(sec["CORRUPÇÃO"]) p.corrupcaoRegra=sec["CORRUPÇÃO"].join(" ");
  if(!p.armadura) p.armadura="Gibão";
  return p;
}


async function importarPDF(file){
  if(!window.pdfjsLib){ alert("Leitor de PDF não carregou (precisa de internet na primeira abertura)."); return; }
  toast("Lendo PDF…");
  const buf=await file.arrayBuffer();
  const doc=await pdfjsLib.getDocument({data:buf}).promise;
  const pages=[];
  for(let i=1;i<=doc.numPages;i++){ const pg=await doc.getPage(i); const vp=pg.getViewport({scale:1}); const tc=await pg.getTextContent();
    pages.push({w:vp.width,items:tc.items.filter(it=>it.str!=null).map(it=>({s:it.str,x:it.transform[4],y:it.transform[5],w:it.width}))}); }
  const p=parseFichaPDF(pages,CARDS);
  if(!p.nome){ alert("Não reconheci esse PDF como uma ficha 'Surto Selvagem · ficha de mesa'."); return; }
  const base=BASE.find(b=>b.id===PJ[cur].id);
  const same=PJ.findIndex(x=>(x.nome||"").toLowerCase()===p.nome.toLowerCase());
  const alvo = same>=0 ? same : cur;
  const msg = same>=0 ? "Encontrei a ficha de "+p.nome+". Substituir a aba existente?\n\n(Cancelar = criar uma nova aba)" : "Importar "+p.nome+" ("+p.classe+" nv "+p.nivel+").\n\nOK = substituir a aba atual ("+PJ[cur].nome+")\nCancelar = criar uma nova aba";
  const substituir=confirm(msg);
  if(substituir){ const old=PJ[alvo]; p.id=old.id; p.pv=0;p.fad=0;p.esp=old.esp??2;p.arm=0;p.corr=old.corr||0; p.bolsa=old.bolsa||[]; p.recursos=old.recursos||[]; p.notas=(old.notas||"")+(p.notas?"\n"+p.notas:""); if(!p.corrupcaoRegra) p.corrupcaoRegra=old.corrupcaoRegra||""; PJ[alvo]=p; cur=alvo; }
  else { p.pv=0;p.fad=0;p.esp=2;p.arm=0;p.corr=0; if(!p.corrupcaoRegra) p.corrupcaoRegra=BASE[0].corrupcaoRegra; PJ.push(p); cur=PJ.length-1; }
  lsSet(KEY+"_cur",String(cur));
  saveAll(); render(); window.scrollTo({top:0}); toast("Ficha de "+p.nome+" importada");
}
/* ============ COMPONENTES ============ */
function pipRow(cls,n,val,onclick){
  const row=el("div","pips");
  for(let i=1;i<=n;i++){
    const p=el("div","pip "+cls+(i<=val?" on":""));
    p.title=i; p.onclick=()=>onclick(i===val?i-1:i);
    row.appendChild(p);
  }
  return row;
}
function tracker(titulo,cls,val,max,set,extra){
  const box=el("div","trk");
  const lb=el("div","lb"); lb.appendChild(el("b",null,titulo));
  lb.appendChild(el("span",null,(extra||"")+val+" / "+max));
  box.appendChild(lb);
  box.appendChild(pipRow(cls,max,val,v=>{set(v);ch();}));
  return box;
}
function numField(lbl,val,set,big){
  const d=el("div","st"+(big?" big":"")); d.appendChild(el("label",null,lbl));
  const i=el("input"); i.type="number"; i.value=val;
  i.onchange=()=>{set(parseInt(i.value)||0);ch();};
  d.appendChild(i); return d;
}
function featBlock(list,i,extraCls){
  const f=list[i];
  const box=el("div","feat"+(extraCls?" "+extraCls:""));
  if(f._ed){
    const n=el("input","tx"); n.value=f.n; n.placeholder="Nome"; n.oninput=()=>f.n=n.value; box.appendChild(n);
    const t=el("textarea"); t.value=f.t; t.placeholder="Texto"; t.oninput=()=>f.t=t.value; box.appendChild(t);
    const bts=el("div","bts");
    const ok=el("button","ok","✓ salvar"); ok.onclick=()=>{delete f._ed;ch();};
    const rm=el("button","rm","✕ remover"); rm.onclick=()=>{list.splice(i,1);ch();};
    bts.appendChild(ok); bts.appendChild(rm); box.appendChild(bts);
  } else {
    box.appendChild(el("b",null,esc(f.n)));
    box.appendChild(el("p",null,esc(f.t)));
    const ed=el("button","ed","✎"); ed.title="editar"; ed.onclick=()=>{f._ed=true;render();}; box.appendChild(ed);
  }

}
function featList(parent,titulo,list,extraCls){

  sb.appendChild(numField("Esperança máx",p.esperancaMax,v=>p.esperancaMax=v));
  sb.appendChild(numField("PV máx",p.pvMax,v=>p.pvMax=v));
  sb.appendChild(numField("Fadiga máx",p.fadigaMax,v=>p.fadigaMax=v));
  sb.appendChild(numField("Armadura máx",p.armaduraMax,v=>p.armaduraMax=v));
  sb.appendChild(numField("Lim. menor",p.limMenor,v=>p.limMenor=v));
  sb.appendChild(numField("Lim. grave",p.limGrave,v=>p.limGrave=v));
  c.appendChild(sb);
  const thr=el("div","thr");
  thr.innerHTML="<div><i>menor</i><b>1–"+(p.limMenor-1)+"</b>1 PV</div><div><i>maior</i><b>"+p.limMenor+"–"+(p.limGrave-1)+"</b>2 PV</div><div><i>grave</i><b>"+p.limGrave+"+</b>3 PV</div>";
  c.appendChild(thr);
  c.appendChild(el("label","fl","Atributos · toque no nome para usar nos dados"));
  const ag=el("div","agrid");
  ATRS.forEach(a=>{
    const b=el("div","ab"+(DICE.atr===a?" sel":"")); b.appendChild(el("label",null,a));
    b.onclick=(e)=>{ if(e.target.tagName==="BUTTON")return; DICE.atr=a; render(); };
    const row=el("div","row");
    const m=el("button",null,"–"); m.onclick=()=>{p.atributos[a]--;ch();};
    const v=el("div","v",sg(p.atributos[a]));
    const pl=el("button",null,"+"); pl.onclick=()=>{p.atributos[a]++;ch();};
    row.appendChild(m);row.appendChild(v);row.appendChild(pl); b.appendChild(row); ag.appendChild(b);
  });
  c.appendChild(ag); R.appendChild(c);

  // ---------- EQUIPAMENTO ----------
  c=el("div","card"); c.appendChild(el("h2",null,"Armas & Armadura <small>patamares 1–4</small>"));
  function eqSelect(lbl,list,atual,set){
    c.appendChild(el("label","fl",lbl));
    const s=el("select"); const groups={};
    list.forEach(x=>{
      const g=groups[x.t]||(groups[x.t]=el("optgroup")); g.label=x.t+"º patamar";
      const o=el("option",null,x.n+(x.dano&&x.dano!=="—"?"  ·  "+x.dano:"")+(x.limMenor?"  ·  "+x.limMenor+"/"+x.limGrave:""));
      o.value=x.n; if(x.n===atual)o.selected=true; g.appendChild(o);
    });
    Object.keys(groups).sort().forEach(k=>s.appendChild(groups[k]));
    if(atual&&!findEq(list,atual)){ const o=el("option",null,atual+" (personalizada)"); o.value=atual; o.selected=true; s.appendChild(o); }
    s.onchange=()=>{set(s.value);ch();};
    c.appendChild(s);
    const x=findEq(list,atual);
    if(x&&x.n!=="Nenhuma"){
      let txt;
      if(x.limMenor!=null) txt="Limiares base <b>"+(x.corporal?"9/19 · 11/24 · 13/31 · 15/38":x.limMenor+"/"+x.limGrave)+"</b> · Armadura base <b>"+(x.corporal?(3+(p.atributos["Força"]||0))+" (3 + Força)":x.base)+"</b>";
      else txt="<b>"+x.atr+"</b> · "+x.alc+" · <b>"+x.dano+"</b> · "+x.maos;
      if(x.hab) txt+="<br>"+esc(x.hab);
      c.appendChild(el("div","eqinfo",txt));
    }
  }
  eqSelect("Arma principal",EQP.prim,p.armaPrim,v=>p.armaPrim=v);
  eqSelect("Arma secundária",EQP.sec,p.armaSec,v=>p.armaSec=v);
  eqSelect("Arma de reserva (na mochila)",EQP.res,p.armaRes||"Nenhuma",v=>p.armaRes=v);
  eqSelect("Armadura",EQP.arm,p.armadura,v=>p.armadura=v);
  const a=findEq(EQP.arm,p.armadura), s2=findEq(EQP.sec,p.armaSec), w1=findEq(EQP.prim,p.armaPrim);
  if(a){
    let base=a.corporal?3+(p.atributos["Força"]||0):a.base; if(s2&&s2.pa)base+=s2.pa;
    let lm,lg; if(a.corporal){ const T=[[9,19],[11,24],[13,31],[15,38]][pat-1]; lm=T[0];lg=T[1]; } else { lm=a.limMenor+p.nivel; lg=a.limGrave+p.nivel; }
    if(p.id==="azura"){lm+=1;lg+=1;}
    const ev=(a.ev||0)+(s2&&s2.ev?s2.ev:0)+(w1&&/–1 em Evasão|−1 em Evasão|-1 em Evasão|na Evasão/.test(w1.hab||"")?-1:0);
    const h=el("div","hint","Pelo equipamento: Armadura <b>"+base+"</b> · limiares <b>"+lm+"/"+lg+"</b> (base + nível"+(p.id==="azura"?" + Resoluto":"")+") · Evasão base"+(ev?" <b>"+sg(ev)+"</b> pelo equipamento":" sem ajuste")+". Ajuste os campos acima se sua ficha usar outros valores.");
    const bt=el("button","add","aplicar valores sugeridos"); bt.onclick=()=>{p.armaduraMax=base;p.limMenor=lm;p.limGrave=lg;ch();toast("Valores aplicados");};
    c.appendChild(h); c.appendChild(bt);
  }
  c.appendChild(el("label","fl","Itens de classe"));
  const it=el("textarea"); it.value=p.itens||""; it.style.minHeight="56px"; it.onchange=()=>{p.itens=it.value;saveOne(p);}; c.appendChild(it);
  R.appendChild(c);

  // ---------- BOLSA + EXPERIÊNCIAS ----------
  c=el("div","card"); c.appendChild(el("h2",null,"Bolsa <small>"+p.bolsa.length+" itens</small>"));
  const lst=el("div","lst");
  p.bolsa.forEach((b,i)=>{
    const row=el("div","it");
    const n=el("input","tx"); n.value=b.nome; n.placeholder="item"; n.onchange=()=>{b.nome=n.value;saveOne(p);};
    const q=el("input","tx n"); q.type="number"; q.value=b.qtd; q.onchange=()=>{b.qtd=parseInt(q.value)||0;saveOne(p);};
    const x=el("button",null,"✕"); x.onclick=()=>{p.bolsa.splice(i,1);ch();};
    row.appendChild(n);row.appendChild(q);row.appendChild(x); lst.appendChild(row);
  });
  c.appendChild(lst);
  const addb=el("button","add","+ adicionar item"); addb.onclick=()=>{p.bolsa.push({nome:"",qtd:1});ch();}; c.appendChild(addb);
  c.appendChild(el("h2",null,"Experiências")).style.marginTop="16px";
  const le=el("div","lst");
  p.experiencias.forEach((e,i)=>{
    const row=el("div","it");
    const n=el("input","tx"); n.value=e.nome; n.onchange=()=>{e.nome=n.value;saveOne(p);};
    const q=el("input","tx n"); q.type="number"; q.value=e.bonus; q.onchange=()=>{e.bonus=parseInt(q.value)||2;saveOne(p);};
    const x=el("button",null,"✕"); x.onclick=()=>{p.experiencias.splice(i,1);ch();};
    row.appendChild(n);row.appendChild(q);row.appendChild(x); le.appendChild(row);
  });
  c.appendChild(le);
  const ae=el("button","add","+ nova experiência"); ae.onclick=()=>{p.experiencias.push({nome:"",bonus:2});ch();}; c.appendChild(ae);
  R.appendChild(c);

  // ---------- CARTAS ----------
  c=el("div","card");
  const naMao=p.cartas.filter(x=>x.mao).length;
  c.appendChild(el("h2",null,"Cartas de Domínio <small>"+naMao+" na mão · "+(p.cartas.length-naMao)+" na reserva</small>"));
  if(naMao>5) c.appendChild(el("div","hint","<b>Mão acima do limite:</b> o livro permite até 5 cartas na mão (Notoriedade não conta). Mande alguma para a reserva."));
  const cf=el("div","cfilter");
  [["all","todas"],["mao","na mão"],["res","reserva"]].forEach(([k,t])=>{const b=el("button",(p._cf||"all")===k?"on":"",t); b.onclick=()=>{p._cf=k;render();}; cf.appendChild(b);});
  c.appendChild(cf);
  p.cartas.forEach((cd,i)=>{
    const f=p._cf||"all"; if(f==="mao"&&!cd.mao)return; if(f==="res"&&cd.mao)return;
    const box=el("div","carta"+(cd.mao?"":" res")); box.style.borderLeftColor=domColor(cd.dom);
    if(cd._ed){
      const g=el("div","edg");
      const dm=el("select"); Object.keys(CARDS).forEach(d=>{const o=el("option",null,d);o.value=d;if(cd.dom===d)o.selected=true;dm.appendChild(o);}); const oo=el("option",null,"Outro");oo.value="";if(!CARDS[cd.dom])oo.selected=true;dm.appendChild(oo); dm.onchange=()=>cd.dom=dm.value;
      const tp=el("select"); ["Talento","Feitiço","Grimório"].forEach(o=>{const op=el("option",null,o);op.value=o;if(cd.tipo===o)op.selected=true;tp.appendChild(op);}); tp.onchange=()=>cd.tipo=tp.value;
      const lv=el("input","tx"); lv.type="number"; lv.placeholder="Nível"; lv.value=cd.lvl||1; lv.oninput=()=>cd.lvl=parseInt(lv.value)||1;
      const rc=el("input","tx"); rc.type="number"; rc.placeholder="Rec."; rc.value=cd.rec!=null?cd.rec:1; rc.oninput=()=>cd.rec=parseInt(rc.value)||0;
      g.appendChild(dm); g.appendChild(tp); g.appendChild(lv); g.appendChild(rc); box.appendChild(g);
      const nm=el("input","tx"); nm.placeholder="Nome da carta"; nm.value=cd.n||""; nm.oninput=()=>cd.n=nm.value; box.appendChild(nm);
      const tx=el("textarea"); tx.placeholder="Texto da carta"; tx.value=cd.t||""; tx.style.marginTop="6px"; tx.oninput=()=>cd.t=tx.value; box.appendChild(tx);
      const bts=el("div","bts");
      const ok=el("button","ok","✓ salvar"); ok.onclick=()=>{delete cd._ed;ch();toast("Carta salva");};
      const rm=el("button","rm","✕ remover"); rm.onclick=()=>{p.cartas.splice(i,1);ch();};
      bts.appendChild(ok); bts.appendChild(rm); box.appendChild(bts);
    } else {
      const tg=el("div","tg"); tg.innerHTML="<span style='color:"+domColor(cd.dom)+"'>"+(DOM_ICON[cd.dom]||"")+" "+esc(cd.dom||"—")+" · "+esc(cd.tipo||"—")+"</span><span>nv "+(cd.lvl||"?")+" · rec "+(cd.rec!=null?cd.rec:"—")+(cd.mao?"":" · reserva")+"</span>";
      box.appendChild(tg);
      box.appendChild(el("b","nm",esc(cd.n||"(sem nome)")));
      box.appendChild(el("p",null,esc(cd.t||"")));
      const bts=el("div","bts");
      const mv=el("button",cd.mao?"":"ok",cd.mao?"→ reserva":"→ mão"); mv.onclick=()=>{cd.mao=!cd.mao;ch();};
      const ed=el("button",null,"✎ editar"); ed.onclick=()=>{cd._ed=true;render();};
      const rm=el("button","rm","✕"); rm.onclick=()=>{if(confirm("Remover "+cd.n+"?")){p.cartas.splice(i,1);ch();}};
      bts.appendChild(mv); bts.appendChild(ed); bts.appendChild(rm); box.appendChild(bts);
    }
    c.appendChild(box);
  });
  const ac=el("button","add",p._pick?"× fechar lista":"+ escolher carta de domínio"); ac.onclick=()=>{p._pick=!p._pick;render();}; c.appendChild(ac);
  if(p._pick){
    const bar=el("div","pickbar");
    const q=el("input","tx"); q.placeholder="buscar carta…"; q.value=p._q||""; q.oninput=()=>{p._q=q.value;renderPick();}; bar.appendChild(q);
    const lbAll=el("label"); const cb2=el("input"); cb2.type="checkbox"; cb2.checked=!!p._allDom; cb2.onchange=()=>{p._allDom=cb2.checked;renderPick();}; lbAll.appendChild(cb2); lbAll.appendChild(document.createTextNode("todos os domínios")); bar.appendChild(lbAll);
    c.appendChild(bar);
    const box=el("div","pick"); c.appendChild(box);
    function renderPick(){
      box.innerHTML=""; let n=0;
      const doms=p._allDom?Object.keys(CARDS):p.dominios;
      const qq=(p._q||"").toLowerCase();
      doms.forEach(d=>{
        (CARDS[d]||[]).filter(x=>(x.lvl||1)<=p.nivel).forEach(x=>{
          if(p.cartas.some(k=>(k.n||"").toLowerCase()===x.n.toLowerCase())) return;
          if(qq&&!(x.n.toLowerCase().includes(qq)||x.t.toLowerCase().includes(qq))) return;
          n++;
          const o=el("div","op"); o.style.borderLeftColor=domColor(d);
          o.appendChild(el("div","tg",(DOM_ICON[d]||"")+" "+d+" · "+x.tipo+" · nível "+x.lvl+" · recordação "+x.rec));
          o.appendChild(el("b",null,esc(x.n)));
          o.appendChild(el("p",null,esc(x.t)));
          o.onclick=()=>{p.cartas.push({dom:d,tipo:x.tipo,rec:x.rec,lvl:x.lvl,n:x.n,t:x.t,mao:true});p._pick=false;ch();toast("Carta adicionada à mão");};
          box.appendChild(o);
        });
      });
      if(!n) box.appendChild(el("div","hint","Nenhuma carta disponível até o nível "+p.nivel+" em "+doms.join(" e ")+". Suba o nível, marque “todos os domínios” ou crie uma carta manualmente."));
    }
    renderPick();
    const man=el("button","add","+ criar carta manualmente"); man.onclick=()=>{p.cartas.push({dom:p.dominios[0]||"",tipo:"Talento",rec:1,lvl:p.nivel,n:"",t:"",mao:true,_ed:true});p._pick=false;render();}; c.appendChild(man);
  }
  c.appendChild(el("div","hint","<b>Recordação</b> é o custo em Fadiga para trocar uma carta da reserva para a mão fora do repouso. No repouso a troca é gratuita."));
  R.appendChild(c);

  // ---------- IDENTIDADE & HABILIDADES ----------
  c=el("div","card"); c.appendChild(el("h2",null,"Identidade & Habilidades <small>✎ para editar</small>"));
  featList(c,"Ancestralidade — "+esc(p.ancNome),p.ancFeats);
  featList(c,"Comunidade — "+esc(p.comNome),p.comFeats);
  if(p.transNome||p.transFeats.length) featList(c,"Transformação — "+esc(p.transNome||"—"),p.transFeats,"trans");
  featList(c,"Habilidades de classe — "+esc(p.classe),p.habilidades);
  featList(c,"Subclasse — "+esc(p.subclasse),p.subFeats);
  R.appendChild(c);

  // ---------- NOTAS ----------
  c=el("div","card"); c.appendChild(el("h2",null,"Anotações de sessão"));
  const ta=el("textarea"); ta.value=p.notas||""; ta.placeholder="Cicatrizes do Surto, contatos, dívidas, pistas…"; ta.style.minHeight="120px";
  ta.onchange=()=>{p.notas=ta.value;saveOne(p);}; c.appendChild(ta); R.appendChild(c);

  // ---------- BACKUP ----------
  c=el("div","card"); c.appendChild(el("h2",null,"Backup & impressão"));
  const acts=el("div","acts");
  function baixar(obj,nome){ const b=new Blob([JSON.stringify(obj,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=nome; a.click(); }
  const bj=el("button",null,"💾 Baixar esta ficha (JSON)"); bj.onclick=()=>baixar(limpo(p),"ficha-"+(p.nome||p.id).toLowerCase().replace(/[^a-z0-9]+/gi,"-")+".json"); acts.appendChild(bj);
  const bja=el("button","g","💾 Baixar todas"); bja.onclick=()=>baixar(PJ.map(limpo),"surto-selvagem-fichas.json"); acts.appendChild(bja);
  const bi=el("button","g","📂 Carregar JSON"); bi.onclick=()=>{
    const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
    inp.onchange=()=>{const f=inp.files[0]; if(!f)return; const r=new FileReader();
      r.onload=()=>{try{ let d=JSON.parse(r.result); if(!Array.isArray(d)) d=[d]; let n=0;
        d.forEach(x=>{ if(!x||typeof x!=="object"||!x.nome) return; normaliza(x); if(!x.id) x.id="pj_"+Math.random().toString(36).slice(2,8);
          let i=PJ.findIndex(q=>q.id===x.id); if(i<0) i=PJ.findIndex(q=>(q.nome||"").toLowerCase()===x.nome.toLowerCase());
          if(i>=0){ x.id=PJ[i].id; PJ[i]=x; } else PJ.push(x); n++; });
        saveAll(); toast(n+" ficha(s) carregada(s)"); render(); }catch(e){alert("Arquivo inválido");}};
      r.readAsText(f);}; inp.click();};
  acts.appendChild(bi);
  const bpdf=el("button",null,"📄 Importar ficha PDF"); bpdf.onclick=()=>{
    const inp=document.createElement("input"); inp.type="file"; inp.accept="application/pdf,.pdf";
    inp.onchange=()=>{const f=inp.files[0]; if(!f)return; importarPDF(f).catch(e=>{console.error(e);alert("Não consegui ler o PDF: "+e.message);});}; inp.click();};
  acts.appendChild(bpdf);
  if(!BASE.some(b=>b.id===p.id)){ const bdel=el("button","d","🗑 Remover esta ficha"); bdel.onclick=()=>{ if(confirm("Remover a ficha de "+p.nome+"? Isso não pode ser desfeito.")){ lsDel(KEY_FICHA(p.id)); dbRemove(p.id); PJ.splice(cur,1); cur=Math.max(0,cur-1); saveIndex(); render(); } }; acts.appendChild(bdel); }
  const bpr=el("button","g","🖨 Imprimir"); bpr.onclick=()=>window.print(); acts.appendChild(bpr);
  const br=el("button","d",window._resetArmado?"⚠ tocar de novo para confirmar":"↺ Restaurar esta ficha");
  br.onclick=()=>{
    if(!window._resetArmado){window._resetArmado=true;render();setTimeout(()=>{window._resetArmado=false;render();},4000);return;}
    window._resetArmado=false;
    const b=BASE.find(x=>x.id===p.id); if(b){ PJ[cur]=normaliza(JSON.parse(JSON.stringify(b))); }
    saveOne(PJ[cur]);toast("Ficha restaurada");render();};
  acts.appendChild(br);
  c.appendChild(acts);
  c.appendChild(el("div","hint","<b>Importar ficha PDF</b> lê os PDFs exportados no formato “Surto Selvagem · ficha de mesa” (como os que geraram estas abas): nome, atributos, limiares, armas, ancestralidade, habilidades, cartas e experiências. Confira os números depois — anotações à mão ou sobrepostas no PDF podem confundir a leitura. Cada ficha é salva separadamente. Com o banco configurado (veja o topo do arquivo / README), as fichas ficam na nuvem e todos da mesa veem as mudanças ao vivo; sem banco, ficam só neste navegador. Ao subir no GitHub Pages, cada jogador abre a mesma página no próprio celular e o estado fica salvo no aparelho dele. Use <b>Baixar JSON</b> no fim da sessão como backup e <b>Carregar JSON</b> para migrar de aparelho."));
  R.appendChild(c);
}
render();
dbInit();
</script>
</body>
</html>
